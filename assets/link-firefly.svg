<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 40" width="156" height="40">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
    .hud { font-family: 'Courier New', monospace; font-weight: 700; }
    .cursor { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .fade { opacity: 0; animation: fadein 0.6s ease-out forwards; }
    @keyframes fadein { to { opacity: 1; } }
  </style>
  <rect width="156" height="40" rx="10" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="155" height="39" rx="10" fill="none" stroke="#334155"/>
  <rect x="16" y="14.5" width="11" height="11" rx="2.5" fill="#F59E0B"/>
  <text class="hud" x="38" y="24.5" font-size="12" fill="#e2e8f0">FIREFLY STACK</text>
</svg>
