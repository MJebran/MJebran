<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 288" width="700" height="288">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
    .hud { font-family: 'Courier New', monospace; font-weight: 700; }
    .cursor { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <rect width="700" height="288" rx="12" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="699" height="287" rx="12" fill="none" stroke="#334155"/>

  <!-- window chrome -->
  <circle cx="26" cy="24" r="5" fill="#F87171"/>
  <circle cx="44" cy="24" r="5" fill="#F59E0B"/>
  <circle cx="62" cy="24" r="5" fill="#34D399"/>
  <text class="hud" x="350.0" y="29" font-size="12" fill="#64748b" text-anchor="middle">ahmad@fireflystack:~$ whoami</text>
  <line x1="1" y1="42" x2="699" y2="42" stroke="#334155"/>

  <!-- section headers -->
  <text class="hud" x="32" y="74" font-size="13" fill="#F59E0B">&#9654; ABOUT</text>
  <rect x="32" y="82" width="46" height="2" rx="1" fill="#F59E0B"/>
  <text class="hud" x="472" y="74" font-size="13" fill="#22D3EE">&#9654; AT A GLANCE</text>
  <rect x="472" y="82" width="88" height="2" rx="1" fill="#22D3EE"/>

  <!-- divider -->
  <line x1="448" y1="60" x2="448" y2="264" stroke="#334155" stroke-dasharray="1 5" stroke-linecap="round"/>

  <text x="32" y="108" font-size="13.5"><tspan fill="#e2e8f0">Software engineer and founder of </tspan><tspan fill="#F59E0B" font-weight="700">FireFly Stack LLC</tspan><tspan fill="#e2e8f0"> —</tspan></text>
  <text x="32" y="127" font-size="13.5"><tspan fill="#e2e8f0">a Utah studio designing and building modern websites</tspan></text>
  <text x="32" y="146" font-size="13.5"><tspan fill="#e2e8f0">and software for businesses.</tspan></text>
  <text x="32" y="174" font-size="13.5"><tspan fill="#e2e8f0">My background bridges engineering and product,</tspan></text>
  <text x="32" y="193" font-size="13.5"><tspan fill="#e2e8f0">with degrees across </tspan><tspan fill="#34D399" font-weight="700">software</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#60A5FA" font-weight="700">management</tspan><tspan fill="#e2e8f0">, and </tspan><tspan fill="#A78BFA" font-weight="700">biomedical</tspan></text>
  <text x="32" y="212" font-size="13.5"><tspan fill="#e2e8f0">engineering — technical depth plus business thinking.</tspan></text>
  <text x="32" y="240" font-size="13.5"><tspan fill="#64748b">Currently: </tspan><tspan fill="#e2e8f0">growing FireFly Stack, launching SaaS</tspan></text>
  <text x="32" y="259" font-size="13.5"><tspan fill="#e2e8f0">products, and building </tspan><tspan fill="#22D3EE" font-weight="700">AI-powered applications</tspan><tspan fill="#e2e8f0">.</tspan></text>
  <text class="hud cursor" x="32" y="288" font-size="13" fill="#34D399">&#9608;</text>
  <rect x="472" y="96" width="11" height="11" rx="2.5" fill="#F87171"/>
  <text x="494" y="106" font-size="13.5" fill="#e2e8f0">Utah, USA</text>
  <rect x="472" y="122" width="11" height="11" rx="2.5" fill="#F59E0B"/>
  <text x="494" y="132" font-size="13.5" fill="#e2e8f0">Founder · FireFly Stack LLC</text>
  <rect x="472" y="148" width="11" height="11" rx="2.5" fill="#34D399"/>
  <text x="494" y="158" font-size="13.5" fill="#e2e8f0">B.S. Software Engineering</text>
  <rect x="472" y="174" width="11" height="11" rx="2.5" fill="#60A5FA"/>
  <text x="494" y="184" font-size="13.5" fill="#e2e8f0">M.S. Engineering Management</text>
  <rect x="472" y="200" width="11" height="11" rx="2.5" fill="#A78BFA"/>
  <text x="494" y="210" font-size="13.5" fill="#e2e8f0">B.S. Biomedical Engineering</text>
  <rect x="472" y="226" width="11" height="11" rx="2.5" fill="#22D3EE"/>
  <text x="494" y="236" font-size="13.5" fill="#e2e8f0">SaaS · AI apps · client work</text>
  <rect x="472" y="252" width="11" height="11" rx="2.5" fill="#F472B6"/>
  <text x="494" y="262" font-size="13.5" fill="#e2e8f0">Hiking · cinema · gym</text>
